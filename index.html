<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoMech - Mechanic Management System</title>
    <link rel="stylesheet" href="dist/styles.css">
    <link rel="stylesheet" href="src/config/colors.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-gray-50">
    <div id="app" class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>
        <div id="main-content" class="flex-1 flex flex-col overflow-hidden">
            <div id="header-container"></div>
            <div id="page-content" class="flex-1 overflow-y-auto p-6"></div>
        </div>
    </div>
    
    <div id="modals-container"></div>
    <div id="notification-container" class="fixed top-4 right-4 z-50"></div>
    
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-4">
            <div class="page-loader"></div>
            <span class="text-gray-700">Loading...</span>
        </div>
    </div>
    
    <script>
        AOS.init({ duration: 800, easing: 'ease-in-out', once: true });

        function replaceFeatherIcons() {
            if (typeof feather !== 'undefined') feather.replace();
        }
        
        window.showLoading = function() {
            document.getElementById('loading-overlay').classList.remove('hidden');
        };
        
        window.hideLoading = function() {
            document.getElementById('loading-overlay').classList.add('hidden');
        };
        
        window.showNotification = function(message, type = 'info', duration = 5000) {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };
            
            notification.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg mb-2 transform translate-x-full transition-transform duration-300`;
            notification.textContent = message;
            
            container.appendChild(notification);
            
            setTimeout(() => notification.classList.remove('translate-x-full'), 100);
            setTimeout(() => {
                notification.classList.add('translate-x-full');
                setTimeout(() => container.removeChild(notification), 300);
            }, duration);
        };
    </script>
    <script src="src/app.js" type="module"></script>
</body>
</html>
